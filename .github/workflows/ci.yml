name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything that needs neither a browser, a key, nor a network. This is the
  # gate: three bugs shipped in one afternoon that these suites catch.
  # Windows is in the matrix because it was the one platform nobody had run
  # this on, and every path in here is built with node:path — which is right
  # on Windows and easy to be wrong about.
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run smoke:offline

  # The page reader, against a fixture in real Chromium. Separate because it
  # downloads a browser, and slow enough that it should not hold up the rest.
  # On every platform, because this is the only job that launches a browser
  # and "does Chromium come up at all here" is the question Windows was most
  # likely to answer differently.
  dom:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cloakbrowser
          key: cloakbrowser-${{ runner.os }}
      - run: npm ci
      - run: npm run smoke:dom

  # What a person who installs this actually gets. The tests all run from the
  # checkout, where every file is present whether or not `files` lists it —
  # so a missing entry, or a bin that cannot find dist, shows up here and
  # nowhere else. Installed into a path with a space in it on purpose.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination /tmp
      - name: install it somewhere else
        run: |
          mkdir -p "/tmp/install here"
          cd "/tmp/install here"
          npm init -y
          npm i /tmp/gahoole-*.tgz
      - name: it runs, and it answers
        run: |
          cd "/tmp/install here"
          ./node_modules/.bin/gahoole --version
          printf 'hello\n' | GAHOOLE_BACKEND=stub GAHOOLE_STUB='["it works."]' \
            NO_COLOR=1 ./node_modules/.bin/gahoole --no-banner --trust | tee out.txt
          grep -q "it works." out.txt
